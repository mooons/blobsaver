name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            os: macos-15
            launcher: build/jpackage/blobsaver.app/Contents/MacOS/blobsaver
          - platform: macOS-x64
            os: macos-15-intel
            launcher: build/jpackage/blobsaver.app/Contents/MacOS/blobsaver
          - platform: Windows-x64
            os: windows-2022
            launcher: build/jpackage/blobsaver/blobsaver.exe
          - platform: Linux-x64
            os: ubuntu-22.04
            launcher: build/jpackage/blobsaver/bin/blobsaver
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libplist-dev libimobiledevice-dev libirecovery-1.0-dev fakeroot
      - name: Gradle build
        run: ./gradlew build --no-daemon --console=plain
      - name: Check packaged launcher
        env:
          APP_EXECUTABLE: ${{ matrix.launcher }}
        run: '"$APP_EXECUTABLE" --help'
      - name: Upload runnable packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: build/distributions/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: failure-${{ matrix.platform }}
          path: build/reports/
  release:
    name: Create public releases
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
    permissions:
      contents: write
    steps:
      - name: Get artifacts
        uses: actions/download-artifact@v8
      - name: Get version from commit
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          read -r _ version _ <<< "$COMMIT_MESSAGE"
          test -n "$version"
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Release public builds
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          prerelease: false
          draft: true
          files: "**/*"
